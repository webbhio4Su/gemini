<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fast Clock</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {

    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            #45aef5,
            #9bddff
        );

    transition:
        background 1s linear;
}


/* =========================
   CLOCK
========================= */

#clock {

    position:
        relative;

    z-index:
        20;

    text-align:
        center;

    color:
        white;

    user-select:
        none;

    text-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .4
        );
}


#time {

    font-size:
        clamp(
            50px,
            10vw,
            120px
        );

    font-weight:
        bold;

    letter-spacing:
        4px;

    font-variant-numeric:
        tabular-nums;
}


#day {

    margin-top:
        10px;

    font-size:
        clamp(
            22px,
            3vw,
            38px
        );

    font-weight:
        bold;
}


/* =========================
   SETTINGS BUTTON
========================= */

#settingsButton {

    position:
        fixed;

    top:
        20px;

    right:
        20px;

    z-index:
        100;

    padding:
        12px 18px;

    border:
        none;

    border-radius:
        12px;

    background:
        rgba(
            255,
            255,
            255,
            .92
        );

    color:
        #222;

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .2
        );

    transition:
        .2s;
}


#settingsButton:hover {

    transform:
        scale(1.05);
}


/* =========================
   SETTINGS
========================= */

#settings {

    position:
        fixed;

    top:
        75px;

    right:
        20px;

    z-index:
        100;

    width:
        310px;

    padding:
        20px;

    border-radius:
        18px;

    background:
        rgba(
            255,
            255,
            255,
            .97
        );

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            .3
        );

    display:
        none;
}


#settings.show {

    display:
        block;
}


#settings h2 {

    margin:
        0 0 8px;

    font-size:
        21px;
}


#settings p {

    margin:
        0 0 15px;

    color:
        #666;

    font-size:
        13px;

    line-height:
        1.5;
}


/* =========================
   CODE INPUT
========================= */

#codeInput {

    width:
        100%;

    padding:
        12px;

    border:
        2px solid
        #ddd;

    border-radius:
        10px;

    outline:
        none;

    font-family:
        monospace;

    font-size:
        21px;

    text-align:
        center;

    letter-spacing:
        3px;

    text-transform:
        lowercase;
}


#codeInput:focus {

    border-color:
        #555;
}


/* =========================
   DAY INPUT
========================= */

#dayInput {

    width:
        100%;

    margin-top:
        10px;

    padding:
        11px;

    border:
        2px solid
        #ddd;

    border-radius:
        10px;

    outline:
        none;

    font-size:
        16px;
}


#dayInput:focus {

    border-color:
        #555;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display:
        flex;

    gap:
        8px;

    margin-top:
        15px;
}


.buttons button {

    flex:
        1;

    padding:
        11px;

    border:
        none;

    border-radius:
        9px;

    cursor:
        pointer;

    font-weight:
        bold;
}


#apply {

    background:
        #222;

    color:
        white;
}


#close {

    background:
        #ddd;

    color:
        #222;
}


/* =========================
   SUN
========================= */

.sun {

    position:
        fixed;

    width:
        100px;

    height:
        100px;

    border-radius:
        50%;

    background:
        #ffd83d;

    box-shadow:

        0 0 30px
        #ffd83d,

        0 0 70px
        #ffd83d,

        0 0 120px
        #ffd83d;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:
        2;
}


/* =========================
   MOON
========================= */

.moon {

    position:
        fixed;

    width:
        80px;

    height:
        80px;

    border-radius:
        50%;

    background:
        #eeeeee;

    box-shadow:

        0 0 25px
        white,

        0 0 50px
        rgba(
            255,
            255,
            255,
            .5
        );

    transform:
        translate(
            -50%,
            -50%
        );

    opacity:
        0;

    z-index:
        2;
}


/* =========================
   STARS
========================= */

.star {

    position:
        fixed;

    width:
        3px;

    height:
        3px;

    border-radius:
        50%;

    background:
        white;

    opacity:
        0;

    z-index:
        1;

    box-shadow:
        0 0 5px white;

    animation:
        twinkle
        1.5s
        infinite
        alternate;
}


@keyframes twinkle {

    from {
        opacity:
            .2;
    }

    to {
        opacity:
            1;
    }
}


/* =========================
   CLOUD
========================= */

.cloud {

    position:
        fixed;

    width:
        140px;

    height:
        45px;

    border-radius:
        50px;

    background:
        rgba(
            255,
            255,
            255,
            .7
        );

    opacity:
        .6;

    z-index:
        3;

    animation:
        cloudMove
        35s
        linear
        infinite;
}


.cloud::before,
.cloud::after {

    content:
        "";

    position:
        absolute;

    background:
        inherit;

    border-radius:
        50%;
}


.cloud::before {

    width:
        70px;

    height:
        70px;

    left:
        20px;

    bottom:
        5px;
}


.cloud::after {

    width:
        55px;

    height:
        55px;

    right:
        20px;

    bottom:
        5px;
}


@keyframes cloudMove {

    from {

        transform:
            translateX(
                -200px
            );
    }

    to {

        transform:
            translateX(
                calc(
                    100vw +
                    200px
                )
            );
    }
}

</style>
</head>


<body>


<div class="sun"></div>

<div class="moon"></div>


<!-- SAO -->

<div class="star" style="left:8%;top:12%"></div>
<div class="star" style="left:16%;top:28%"></div>
<div class="star" style="left:25%;top:10%"></div>
<div class="star" style="left:35%;top:22%"></div>
<div class="star" style="left:47%;top:12%"></div>
<div class="star" style="left:58%;top:30%"></div>
<div class="star" style="left:68%;top:15%"></div>
<div class="star" style="left:78%;top:27%"></div>
<div class="star" style="left:88%;top:10%"></div>
<div class="star" style="left:93%;top:40%"></div>

<div class="star" style="left:12%;top:50%"></div>
<div class="star" style="left:32%;top:42%"></div>
<div class="star" style="left:52%;top:50%"></div>
<div class="star" style="left:73%;top:45%"></div>


<!-- MÂY -->

<div
    class="cloud"
    style="
        top:15%;
        left:-150px;
    ">
</div>


<div
    class="cloud"
    style="
        top:32%;
        left:-300px;
        animation-delay:12s;
        transform:scale(.7);
    ">
</div>


<!-- CLOCK -->

<div id="clock">

    <div id="time">
        00:00:00
    </div>

    <div id="day">
        Ngày 1
    </div>

</div>


<!-- SETTINGS BUTTON -->

<button id="settingsButton">
    ⚙️ Chỉnh giờ
</button>


<!-- SETTINGS -->

<div id="settings">

    <h2>
        ⚙️ Chỉnh giờ
    </h2>

    <p>
        Nhập mã thời gian 24 giờ.<br>
        Ví dụ:
        <b>aa:zz</b>
        = 11:00
    </p>


    <input
        id="codeInput"
        type="text"
        placeholder="aa:zz"
        autocomplete="off"
        spellcheck="false"
    >


    <input
        id="dayInput"
        type="number"
        min="1"
        placeholder="Ngày"
    >


    <div class="buttons">

        <button id="apply">
            ▶ Áp dụng
        </button>

        <button id="close">
            Đóng
        </button>

    </div>

</div>


<script>

/*
====================================================
BẢNG MÃ
====================================================

0 = z
1 = a
2 = b
3 = c
4 = d
5 = e
6 = f
7 = g
8 = h
9 = i

====================================================
*/


const decodeMap = {

    a: "1",
    b: "2",
    c: "3",
    d: "4",
    e: "5",
    f: "6",
    g: "7",
    h: "8",
    i: "9",
    z: "0"

};


/*
====================================================
GIẢI MÃ
====================================================
*/

function decodeNumber(text) {

    return text
        .split("")
        .map(
            char =>
                decodeMap[char] ?? char
        )
        .join("");

}


/*
====================================================
LẤY THỜI GIAN MÁY
====================================================

Chỉ lấy một lần khi trang mở.

Ví dụ máy đang:

14:35:20

thì đồng hồ bắt đầu:

14:35:20

Sau đó chạy nhanh 60 lần.
====================================================
*/


const now =
    new Date();


let fakeStartSeconds =

    now.getHours() * 3600 +

    now.getMinutes() * 60 +

    now.getSeconds();


/*
Ngày thật của máy
*/

let startingDay =
    now.getDate();


/*
Thời điểm thật bắt đầu
*/

let startRealTime =
    Date.now();


/*
====================================================
ELEMENTS
====================================================
*/

const timeElement =
    document.getElementById(
        "time"
    );


const dayElement =
    document.getElementById(
        "day"
    );


const sun =
    document.querySelector(
        ".sun"
    );


const moon =
    document.querySelector(
        ".moon"
    );


const stars =
    document.querySelectorAll(
        ".star"
    );


const settings =
    document.getElementById(
        "settings"
    );


/*
====================================================
MỞ CHỈNH GIỜ
====================================================
*/

document.getElementById(
    "settingsButton"
).onclick = () => {

    settings.classList.toggle(
        "show"
    );

};


/*
====================================================
ĐÓNG
====================================================
*/

document.getElementById(
    "close"
).onclick = () => {

    settings.classList.remove(
        "show"
    );

};


/*
====================================================
ÁP DỤNG
====================================================
*/

document.getElementById(
    "apply"
).onclick = () => {

    const input =
        document.getElementById(
            "codeInput"
        )
        .value
        .trim()
        .toLowerCase();


    /*
    Cho phép:

    aa:zz

    hoặc

    aazz
    */

    let match =
        input.match(
            /^([a-iz]{2}):([a-iz]{2})$/
        );


    if (!match) {

        match =
            input.match(
                /^([a-iz]{2})([a-iz]{2})$/
            );

    }


    /*
    Kiểm tra
    */

    if (!match) {

        alert(
            "Mã không hợp lệ!\n\n" +

            "Ví dụ:\n" +

            "zz:zz = 00:00\n" +

            "za:ab = 01:12\n" +

            "aa:zz = 11:00\n" +

            "ab:zz = 12:00\n" +

            "bc:de = 23:45"
        );

        return;
    }


    /*
    ================================================
    GIẢI MÃ GIỜ
    ================================================
    */

    const hour =
        Number(
            decodeNumber(
                match[1]
            )
        );


    /*
    ================================================
    GIẢI MÃ PHÚT
    ================================================
    */

    const minute =
        Number(
            decodeNumber(
                match[2]
            )
        );


    /*
    ================================================
    KIỂM TRA
    ================================================
    */

    if (
        hour < 0 ||
        hour > 23
    ) {

        alert(
            "Giờ phải từ 00 đến 23!"
        );

        return;
    }


    if (
        minute < 0 ||
        minute > 59
    ) {

        alert(
            "Phút phải từ 00 đến 59!"
        );

        return;
    }


    /*
    ================================================
    NGÀY
    ================================================
    */

    let day =
        Number(
            document.getElementById(
                "dayInput"
            ).value
        );


    if (
        !Number.isFinite(day) ||
        day < 1
    ) {

        day =
            startingDay;

    }


    /*
    ================================================
    ĐẶT GIỜ
    ================================================
    */

    fakeStartSeconds =

        hour * 3600 +

        minute * 60;


    startingDay =
        Math.floor(day);


    /*
    Reset tốc độ
    */

    startRealTime =
        Date.now();


    /*
    Đóng
    */

    settings.classList.remove(
        "show"
    );


    updateClock();

};


/*
====================================================
CẬP NHẬT
====================================================
*/

function updateClock() {


    /*
    Thời gian thật trôi qua
    */

    const elapsed =
        Date.now() -
        startRealTime;


    /*
    1 giây thật
    =
    60 giây giả
    */

    const fakeElapsedSeconds =

        (
            elapsed /
            1000
        ) * 60;


    /*
    Tổng thời gian
    */

    const total =

        fakeStartSeconds +
        fakeElapsedSeconds;


    /*
    ================================================
    NGÀY
    ================================================
    */

    const extraDays =

        Math.floor(
            total /
            86400
        );


    const day =

        startingDay +
        extraDays;


    /*
    ================================================
    GIỜ TRONG NGÀY
    ================================================
    */

    const daySeconds =

        (
            total %
            86400 +
            86400
        ) %
        86400;


    /*
    ================================================
    GIỜ
    ================================================
    */

    const hours =

        Math.floor(
            daySeconds /
            3600
        );


    /*
    ================================================
    PHÚT
    ================================================
    */

    const minutes =

        Math.floor(
            (
                daySeconds %
                3600
            ) / 60
        );


    /*
    ================================================
    GIÂY
    ================================================
    */

    const seconds =

        Math.floor(
            daySeconds %
            60
        );


    /*
    ================================================
    HIỂN THỊ
    ================================================
    */

    timeElement.textContent =

        String(hours)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(minutes)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(seconds)
            .padStart(
                2,
                "0"
            );


    /*
    ================================================
    NGÀY
    ================================================
    */

    dayElement.textContent =

        "Ngày " +
        day;


    /*
    ================================================
    BẦU TRỜI
    ================================================
    */

    updateSky(
        daySeconds
    );

}


/*
====================================================
BẦU TRỜI
====================================================
*/

function updateSky(
    daySeconds
) {

    const time =

        daySeconds /
        3600;


    /*
    ================================================
    BAN NGÀY
    ================================================
    */

    if (
        time >= 6 &&
        time < 18
    ) {

        document.body.style.background =

            "linear-gradient(" +
            "#45aef5, " +
            "#9bddff" +
            ")";


        sun.style.opacity =
            "1";


        moon.style.opacity =
            "0";


        stars.forEach(
            star => {

                star.style.opacity =
                    "0";

            }
        );


        /*
        Vị trí mặt trời
        */

        const progress =

            (
                time - 6
            ) / 12;


        const x =

            5 +
            progress *
            90;


        const y =

            55 -

            Math.sin(
                progress *
                Math.PI
            ) *

            45;


        sun.style.left =
            x + "%";


        sun.style.top =
            y + "%";

    }


    /*
    ================================================
    BAN ĐÊM
    ================================================
    */

    else {

        document.body.style.background =

            "linear-gradient(" +
            "#020617, " +
            "#111827" +
            ")";


        sun.style.opacity =
            "0";


        moon.style.opacity =
            "1";


        stars.forEach(
            star => {

                star.style.opacity =
                    "1";

            }
        );


        let progress;


        if (
            time >= 18
        ) {

            progress =

                (
                    time - 18
                ) / 12;

        }

        else {

            progress =

                (
                    time + 6
                ) / 12;

        }


        const x =

            5 +
            progress *
            90;


        const y =

            55 -

            Math.sin(
                progress *
                Math.PI
            ) *

            45;


        moon.style.left =
            x + "%";


        moon.style.top =
            y + "%";

    }

}


/*
====================================================
CHẠY
====================================================
*/

setInterval(
    updateClock,
    10
);


/*
====================================================
CHẠY NGAY
====================================================
*/

updateClock();

</script>

</body>
</html>
